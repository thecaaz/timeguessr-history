version: '3.8'
services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - collector_db_data:/app/db
    restart: unless-stopped

  collector:
    build: .
    command: ["/bin/sh", "-c", "echo '10 7 * * * cd /app && python3 collector/run.py --headless >> /app/logs/collector.log 2>&1' | crontab - && crond -f -l 2"]
    volumes:
      - collector_db_data:/app/db
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  collector_db_data:
