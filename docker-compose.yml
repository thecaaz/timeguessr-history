version: '3.8'
services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - collector_db_data:/app/db
    restart: unless-stopped

  collector:
    build: .
    command:
      - /bin/sh
      - -c
      - |
        printf 'SHELL=/bin/sh\nPATH=/usr/local/bin:/usr/bin:/bin\n10 7 * * * cd /app && python3 collector/run.py --headless >> /app/logs/collector.log 2>&1\n' | crontab -
        cron -f
    volumes:
      - collector_db_data:/app/db
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  collector_db_data:
