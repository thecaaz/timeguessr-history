name: Release

on:
  workflow_run:
    workflows: ["CI Build"]
    types: [completed]

permissions:
  contents: write
  issues: write

jobs:
  docker:
    name: Build & push Docker image
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch tags
        run: git fetch --tags

      - name: Ensure branch head and tags
        run: |
          git fetch origin main --tags
          git checkout origin/main
          git reset --hard origin/main

      - name: Compute release tag
        id: tag
        run: |
          set -e
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            TAG="v0.1.0"
          else
            V=${LATEST#v}
            IFS='.' read -r MA MI PA <<< "$V" || true
            if [[ "$MA" =~ ^[0-9]+$ && "$MI" =~ ^[0-9]+$ && "$PA" =~ ^[0-9]+$ ]]; then
              PA=$((PA + 1))
              TAG="v${MA}.${MI}.${PA}"
            else
              TAG="v$(date -u +'%Y%m%d%H%M%S')"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/timeguessr-history:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/timeguessr-history:${{ steps.tag.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/timeguessr-history:${{ steps.tag.outputs.tag }}

      - name: Push Git tag
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG=${{ steps.tag.outputs.tag }}
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          release_name: ${{ steps.tag.outputs.tag }}
          body: "Release ${{ steps.tag.outputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
